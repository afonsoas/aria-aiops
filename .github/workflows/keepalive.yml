name: Keep Oracle ADB Alive

# DESATIVADO TEMPORARIAMENTE: a API no Railway foi desligada (free tier
# expirado), entao nao ha endpoint para pingar. Apos o redeploy no Render
# (ver docs/DEPLOY_RENDER.md):
#   1. Trocar a URL abaixo pela URL nova da API
#   2. Descomentar o bloco `schedule`
on:
  # schedule:
  #   - cron: '0 8 */5 * *'   # a cada 5 dias, 8h UTC
  workflow_dispatch:           # permite rodar manualmente pelo GitHub Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ARIA API (mantém conexão Oracle ADB ativa)
        run: |
          curl -f https://SUBSTITUIR-PELA-URL-DO-RENDER/health
          echo "Oracle ADB ping OK"
