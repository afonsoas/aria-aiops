name: ARIA CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Verify models load
        run: |
          python -c "
          import joblib
          ola  = joblib.load('model/model_ola.pkl')
          prio = joblib.load('model/model_priority.pkl')
          enc  = joblib.load('model/encoders.pkl')
          assert 'model' in ola and 'tfidf' in ola and 'metrics' in ola
          assert 'model' in prio and 'tfidf' in prio and 'metrics' in prio
          assert len(enc) == 5
          print('Models OK —', ola['metrics'])
          "

      - name: Run test suite (pytest)
        run: pytest tests/ -v

      - name: Verify dataset exists
        run: |
          python -c "
          from pathlib import Path
          f = Path('data/LW-DATASET.xlsx')
          assert f.exists(), 'Dataset nao encontrado'
          assert f.stat().st_size > 1_000_000, 'Dataset muito pequeno'
          print(f'Dataset OK — {f.stat().st_size/1e6:.1f} MB')
          "

      - name: Lint (nao bloqueia)
        run: |
          pip install ruff -q
          ruff check api/ --ignore E501,E402 || true

  # Deploy: o servico no Railway foi desativado (free tier expirado).
  # O redeploy recomendado e no Render via render.yaml (autoDeploy: true —
  # o proprio Render faz deploy a cada push na main apos conectar o repo).
  # Passo a passo: docs/DEPLOY_RENDER.md
